<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080e20"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Mind Vault"><link rel="manifest" href="manifest.webmanifest"><title>Mind Vault</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at top,#1b3158,#080e20 70%);color:#edf6ff;font:16px -apple-system,BlinkMacSystemFont,system-ui,sans-serif}main{max-width:520px;margin:auto;padding:calc(env(safe-area-inset-top) + 24px) 18px calc(env(safe-area-inset-bottom) + 30px)}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:24px;letter-spacing:1px;margin:0;color:#74edff}.pill{border:1px solid #3b6081;color:#a8e7ff;border-radius:40px;padding:8px;font-size:11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:24px 0}.stat{background:#182740;border:1px solid #2b4162;border-radius:16px;padding:14px 7px;text-align:center}.stat small{color:#a6bad2;display:block;font-size:11px;letter-spacing:1px}.stat strong{font-size:22px;display:block;margin-top:5px}.progress{display:flex;gap:5px;margin-bottom:22px}.progress i{height:5px;flex:1;background:#30415e;border-radius:6px}.progress i.on{background:#64e6ff}.panel{background:#14213a;border:1px solid #334563;border-radius:24px;padding:25px 18px;text-align:center;box-shadow:0 20px 50px #0004}.lock{font-size:44px}.kicker{font-size:12px;letter-spacing:2px;color:#8faac9;margin:14px 0}h2{font-size:22px;line-height:1.35;margin:12px 0 20px}.sequence{font-size:22px;font-weight:750;color:#75eaff;background:#0b152a;padding:22px 8px;border-radius:14px;word-break:break-word}.choices{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:20px 0}.choice{min-height:78px;border-radius:15px;border:1px solid #405473;background:#1c2b47;color:white;font-size:21px;font-weight:700;touch-action:manipulation}.choice:active{transform:scale(.98)}.correct{background:#176958;border-color:#68e7bc}.wrong{background:#7e3048;border-color:#ff8da2}.choice:disabled{opacity:1}.feedback{background:#192a43;border-radius:14px;padding:17px;line-height:1.5;margin:14px 0}.feedback b{color:#83efc5}.primary{width:100%;border:0;border-radius:14px;background:#69e4fb;color:#091729;padding:17px;font-size:17px;font-weight:800;touch-action:manipulation}.foot{text-align:center;color:#8296b3;font-size:12px;margin-top:18px}.hide{display:none}button{cursor:pointer}</style></head><body><main><header><h1>◈ MIND VAULT</h1><span class="pill">BRAIN OPS</span></header><div class="stats"><div class="stat"><small>VAULT</small><strong id="level">1</strong></div><div class="stat"><small>XP</small><strong id="xp">0</strong></div><div class="stat"><small>STREAK</small><strong id="streak">0 🔥</strong></div></div><div class="progress" id="progress"></div><section class="panel"><div class="lock" id="symbol">🔐</div><div class="kicker" id="kicker">VAULT 01</div><h2 id="question"></h2><div class="sequence" id="sequence"></div></section><div class="choices" id="choices"></div><div class="feedback hide" id="feedback"></div><button class="primary hide" id="next">NEXT VAULT →</button><p class="foot" id="foot">Select an answer to unlock the vault</p></main><script>
const puzzles=[['What number comes next?','2 · 6 · 12 · 20 · 30 · ?',['40','42','44','46'],1,'The gaps are +4, +6, +8, +10, then +12.'],['Which number does not belong?','3 · 5 · 7 · 9 · 11',['3','7','9','11'],2,'9 is not prime.'],['Crack the code: A=1, B=2, C=3','C — A — B',['123','312','321','213'],1,'C=3, A=1, B=2.'],['At 3:15, what is the smaller angle between the clock hands?','03 : 15',['0°','7.5°','15°','30°'],1,'The hour hand is 7.5° beyond the 3.'],['Complete the sequence','1 · 1 · 2 · 3 · 5 · 8 · ?',['11','12','13','15'],2,'Each number equals the sum of the previous two.'],['Five machines make five gadgets in five minutes. How long for 100 machines to make 100 gadgets?','5 → 5 → 5',['5 min','20 min','100 min','500 min'],0,'Each machine makes one gadget in five minutes.'],['Replace the question mark','4 → 16    7 → 49    9 → ?',['18','72','81','90'],2,'Square the first number.'],['Exactly one of three switches is ON. How many configurations are possible?','○ ○ ○',['2','3','6','8'],1,'Any of the three switches could be ON.']];
let state={level:0,xp:0,streak:0,answered:false};try{const s=JSON.parse(localStorage.getItem('mindvault-state'));if(s&&Number.isInteger(s.level)&&s.level>=0&&s.level<puzzles.length)state={...state,...s,answered:false}}catch(e){}const $=id=>document.getElementById(id);function save(){localStorage.setItem('mindvault-state',JSON.stringify(state))}function render(){let p=puzzles[state.level];$('level').textContent=state.level+1;$('xp').textContent=state.xp;$('streak').textContent=state.streak+' 🔥';$('progress').innerHTML=puzzles.map((_,i)=>'<i class="'+(i<=state.level?'on':'')+'"></i>').join('');$('symbol').textContent='🔐';$('kicker').textContent='VAULT '+String(state.level+1).padStart(2,'0')+' / '+puzzles.length;$('question').textContent=p[0];$('sequence').textContent=p[1];$('choices').innerHTML='';p[2].forEach((option,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=option;b.addEventListener('click',()=>answer(i));$('choices').append(b)});$('feedback').classList.add('hide');$('next').classList.add('hide');$('foot').textContent='Select an answer to unlock the vault';state.answered=false}function answer(i){if(state.answered)return;state.answered=true;let p=puzzles[state.level],correct=i===p[3];if(correct){state.xp+=100+state.streak*20;state.streak++}else state.streak=0;[...$('choices').children].forEach((b,j)=>{b.disabled=true;if(j===p[3])b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('feedback').innerHTML='<b>'+(correct?'✓ Vault unlocked!':'✕ Not quite!')+'</b><div>'+p[4]+'</div>';$('feedback').classList.remove('hide');$('next').classList.remove('hide');$('next').textContent=state.level===puzzles.length-1?'SEE RESULTS →':'NEXT VAULT →';$('xp').textContent=state.xp;$('streak').textContent=state.streak+' 🔥';save()}$('next').addEventListener('click',()=>{if(state.level===puzzles.length-1){$('symbol').textContent='🏆';$('kicker').textContent='MISSION COMPLETE';$('question').textContent='All vaults unlocked!';$('sequence').textContent=state.xp+' XP';$('choices').innerHTML='';$('feedback').classList.add('hide');$('next').textContent='PLAY AGAIN ↻';$('next').onclick=()=>{state={level:0,xp:0,streak:0,answered:false};$('next').onclick=null;save();render()};$('foot').textContent='You cracked the Mind Vault!'}else{state.level++;save();render()}});render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
